# http-контекст (conf.d): зоны rate-limit + кэш + CORS-whitelist для Bybit-прокси
# Деплой: /etc/nginx/conf.d/10-bybit-proxy.conf на UK1 (51.89.111.251)

# per-IP лимит (защита от одного жадного клиента)
limit_req_zone $binary_remote_addr zone=bybitproxy:10m rate=8r/s;
# ГЛОБАЛЬНЫЙ колпак (ключ-константа): суммарный поток на api2.bybit.com с IP UK1
# не превышает ~12r/s при ЛЮБОМ числе юзеров — Bybit не забанит IP.
limit_req_zone bybitglobal zone=bybitglobal:1m rate=12r/s;

# Кэш POST-ответов: страницы стакана одинаковы для всех юзеров → тысяча человек,
# обновляющих страницу, = один upstream-запрос на страницу в 15 сек.
proxy_cache_path /var/cache/nginx/bybitotc levels=1:2 keys_zone=bybitotc:10m max_size=50m inactive=120s use_temp_path=off;

map $http_origin $bybit_cors {
    default "";
    "https://w1zardz.github.io" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}
