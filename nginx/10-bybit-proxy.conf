# http-контекст (conf.d): зона rate-limit + CORS-whitelist для Bybit-прокси
# Деплой: /etc/nginx/conf.d/10-bybit-proxy.conf на UK1 (51.89.111.251)
limit_req_zone $binary_remote_addr zone=bybitproxy:10m rate=8r/s;

map $http_origin $bybit_cors {
    default "";
    "https://w1zardz.github.io" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}
