<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Fair Rate — Справедливый курс USDT/RUB</title>
    <meta name="description" content="Справедливый курс USDT к рублю на основе данных ЦБ РФ и CoinGecko. Проверь, насколько P2P-оффер отклоняется от реального курса.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
        }

        .fair-rate {
            text-align: center;
        }

        .fair-rate .label {
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .fair-rate .value {
            font-size: 48px;
            font-weight: 700;
            color: #58a6ff;
        }

        .fair-rate .currency {
            font-size: 18px;
            color: #8b949e;
            margin-left: 4px;
        }

        .sources {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .source-item {
            background: #0d1117;
            border-radius: 8px;
            padding: 12px;
        }

        .source-item .source-label {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .source-item .source-value {
            font-size: 18px;
            font-weight: 600;
        }

        .check-section h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #e6edf3;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .input-row input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e6edf3;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            border-color: #58a6ff;
        }

        .input-row input::placeholder {
            color: #484f58;
        }

        .result {
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            display: none;
        }

        .result.show { display: block; }

        .result .deviation {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .result .verdict {
            font-size: 16px;
            font-weight: 600;
        }

        .result .detail {
            font-size: 13px;
            color: #8b949e;
            margin-top: 8px;
        }

        .result.excellent { background: #0d2818; }
        .result.excellent .deviation, .result.excellent .verdict { color: #3fb950; }

        .result.ok { background: #0d2818; }
        .result.ok .deviation, .result.ok .verdict { color: #56d364; }

        .result.weak { background: #2a1f00; }
        .result.weak .deviation, .result.weak .verdict { color: #d29922; }

        .result.trash { background: #2d0a0a; }
        .result.trash .deviation, .result.trash .verdict { color: #f85149; }

        .ranges {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .range-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8b949e;
        }

        .range-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .range-dot.excellent { background: #3fb950; }
        .range-dot.ok { background: #56d364; }
        .range-dot.weak { background: #d29922; }
        .range-dot.trash { background: #f85149; }

        .loading {
            text-align: center;
            color: #8b949e;
            padding: 40px;
        }

        .error {
            color: #f85149;
            text-align: center;
            padding: 16px;
            font-size: 14px;
        }

        .updated {
            text-align: center;
            font-size: 12px;
            color: #484f58;
            margin-top: 8px;
        }

        .refresh-btn {
            background: none;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
            transition: border-color 0.2s, color 0.2s;
        }

        .refresh-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #484f58;
        }

        footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .fair-rate .value { font-size: 36px; }
            .sources { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>USDT Fair Rate</h1>
    <p class="subtitle">Справедливый курс USDT/RUB для P2P-продажи</p>

    <div class="card fair-rate" id="main-card">
        <div class="loading" id="loading">Загрузка курсов...</div>
        <div id="rate-content" style="display:none">
            <div class="label">Справедливый курс</div>
            <div>
                <span class="value" id="fair-rate">—</span>
                <span class="currency">₽ / USDT</span>
            </div>
            <div class="sources">
                <div class="source-item">
                    <div class="source-label">USD/RUB (ЦБ РФ)</div>
                    <div class="source-value" id="cbr-rate">—</div>
                </div>
                <div class="source-item">
                    <div class="source-label">USDT/USD (CoinGecko)</div>
                    <div class="source-value" id="usdt-price">—</div>
                </div>
            </div>
        </div>
        <div class="error" id="error" style="display:none"></div>
    </div>

    <div class="card check-section" id="check-card" style="display:none">
        <h2>Проверь свой оффер</h2>
        <div class="input-row">
            <input type="number" id="offer-input" placeholder="Цена оффера, ₽" step="0.01" inputmode="decimal">
        </div>
        <div class="result" id="result">
            <div class="deviation" id="deviation"></div>
            <div class="verdict" id="verdict"></div>
            <div class="detail" id="detail"></div>
        </div>
        <div class="ranges">
            <div class="range-item"><span class="range-dot excellent"></span> > 0% — отлично</div>
            <div class="range-item"><span class="range-dot ok"></span> 0…−1.5% — норм</div>
            <div class="range-item"><span class="range-dot weak"></span> −1.5…−4% — слабо</div>
            <div class="range-item"><span class="range-dot trash"></span> < −4% — мусор</div>
        </div>
    </div>

    <div class="updated" id="updated"></div>

    <footer>
        Данные: <a href="https://www.cbr-xml-daily.ru/" target="_blank">ЦБ РФ</a> ×
        <a href="https://www.coingecko.com/" target="_blank">CoinGecko</a><br>
        Не является финансовой рекомендацией
    </footer>

    <script>
        const $ = id => document.getElementById(id);

        let fairRate = null;

        async function fetchCBR() {
            const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
            const data = await res.json();
            return data.Valute.USD.Value;
        }

        async function fetchUSDT() {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd');
            const data = await res.json();
            return data.tether.usd;
        }

        async function loadRates() {
            $('loading').style.display = 'block';
            $('rate-content').style.display = 'none';
            $('error').style.display = 'none';
            $('check-card').style.display = 'none';

            try {
                const [usdRub, usdtUsd] = await Promise.all([fetchCBR(), fetchUSDT()]);

                fairRate = usdRub * usdtUsd;

                $('cbr-rate').textContent = usdRub.toFixed(4);
                $('usdt-price').textContent = '$' + usdtUsd.toFixed(4);
                $('fair-rate').textContent = fairRate.toFixed(2);

                $('loading').style.display = 'none';
                $('rate-content').style.display = 'block';
                $('check-card').style.display = 'block';

                const now = new Date();
                $('updated').textContent = 'Обновлено: ' + now.toLocaleTimeString('ru-RU');

                // Re-evaluate if there was input
                evaluateOffer();
            } catch (e) {
                $('loading').style.display = 'none';
                $('error').style.display = 'block';
                $('error').textContent = 'Ошибка загрузки: ' + e.message;
            }
        }

        function evaluateOffer() {
            const input = $('offer-input');
            const result = $('result');
            const val = parseFloat(input.value);

            if (!val || !fairRate) {
                result.classList.remove('show');
                return;
            }

            const diff = val - fairRate;
            const pct = (diff / fairRate) * 100;

            let cls, verdict;
            if (pct > 0) {
                cls = 'excellent';
                verdict = 'Отлично — выше справедливого курса';
            } else if (pct >= -1.5) {
                cls = 'ok';
                verdict = 'Норм — стандартный дисконт';
            } else if (pct >= -4) {
                cls = 'weak';
                verdict = 'Слабо — ниже рынка';
            } else {
                cls = 'trash';
                verdict = 'Мусор — не связывайся';
            }

            result.className = 'result show ' + cls;
            $('deviation').textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
            $('verdict').textContent = verdict;
            $('detail').textContent = val.toFixed(2) + ' ₽ vs ' + fairRate.toFixed(2) + ' ₽ fair (' + (diff >= 0 ? '+' : '') + diff.toFixed(2) + ' ₽)';
        }

        $('offer-input').addEventListener('input', evaluateOffer);

        loadRates();
    </script>
</body>
</html>
